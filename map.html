<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Городской убийца — карта города</title>
  <link rel="stylesheet" href="/src/style/global.css">
</head>

<body class="map-page-body">
  <main class="map-page" aria-label="Игровое поле города «Городской убийца»">
    <header class="map-page__header">
      <a href="./index.html" class="map-back-link">
        Назад в меню
      </a>
      <div class="map-page__title-block">
        <h1 class="map-page__title">Карта города</h1>
      </div>
    </header>

    <aside class="game-state-panel" aria-label="Состояние партии">
      <div class="game-state-panel__row">
        <span class="game-state-panel__round" id="current-round">Раунд 1 из 6</span>
        <span class="game-state-panel__phase" id="current-phase">Фаза убийцы</span>
      </div>
      <div class="game-state-panel__row">
        <span class="game-state-panel__turn" id="turn-indicator">Ожидание…</span>
        <span class="game-code-display" id="display-game-code" aria-hidden="true"></span>
      </div>
    </aside>

    <section class="map-page__content">
      <div class="map-frame map-frame--full">
        <div class="map-board" aria-hidden="true">
          <div class="map-grid">
            <div class="map-cell" data-area-id="roki-hill">
              <span class="map-cell__label">Роки Хилл</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell" data-area-id="port">
              <span class="map-cell__label">Порт</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell" data-area-id="little-italy">
              <span class="map-cell__label">Маленькая Италия</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell" data-area-id="golden-beach">
              <span class="map-cell__label">Золотой пляж</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>

            <div class="map-cell" data-area-id="west-side">
              <span class="map-cell__label">Вест‑Сайд</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell map-cell--central" data-area-id="business-center">
              <span class="map-cell__label">Деловой центр</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell map-cell--central" data-area-id="president-square">
              <span class="map-cell__label">Президентская площадь</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell" data-area-id="east-side">
              <span class="map-cell__label">Ист‑Сайд</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>

            <div class="map-cell" data-area-id="chinatown">
              <span class="map-cell__label">Китайский квартал</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell map-cell--central" data-area-id="central-park">
              <span class="map-cell__label">Центральный парк</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell map-cell--central" data-area-id="santa-cruz">
              <span class="map-cell__label">Санта‑Круз</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell" data-area-id="river-station">
              <span class="map-cell__label">Речной вокзал</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>

            <div class="map-cell" data-area-id="stadium">
              <span class="map-cell__label">Стадион</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell" data-area-id="richmond">
              <span class="map-cell__label">Ричмонд</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell" data-area-id="university">
              <span class="map-cell__label">Университет</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
            <div class="map-cell" data-area-id="old-town">
              <span class="map-cell__label">Старый город</span>
              <div class="map-cell__blocks">
                <div class="map-cell__block" data-block-index="0"></div>
                <div class="map-cell__block" data-block-index="1"></div>
                <div class="map-cell__block" data-block-index="2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
    <script type="module"
            src="./src/main.js"></script>
</body>

</html>
